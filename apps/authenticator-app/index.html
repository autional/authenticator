<!DOCTYPE html>
<html lang="zh-CN" class="dark" data-theme="authenticator">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.autional.cn/ui/v0.1.0-rc.f0db1b97/tokens.css" />
    <link rel="icon" href="https://cdn.autional.cn/ui/v0.1.0-rc.f0db1b97/icons/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="https://cdn.autional.cn/ui/v0.1.0-rc.f0db1b97/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="https://cdn.autional.cn/ui/v0.1.0-rc.f0db1b97/icons/favicon-16x16.png" />
    <link rel="icon" type="image/svg+xml" href="https://cdn.autional.cn/ui/v0.1.0-rc.f0db1b97/icons/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://cdn.autional.cn/ui/v0.1.0-rc.f0db1b97/icons/apple-touch-icon.png" />
    <link rel="manifest" href="https://cdn.autional.cn/ui/v0.1.0-rc.f0db1b97/icons/site.webmanifest" />

    <meta name="theme-color" content="#0a0a0a" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Autional 身份验证器 —— 基于 TOTP 与通行密钥的两步验证。" />
    <title>Autional 身份验证器</title>
      <script src="/env.js"></script>
      <script>
        (function () {
          try {
            var saved = localStorage.getItem('authenticator-app-theme');
            var dark = saved !== 'light'; /* dark-first：无存储或非法值 → 深色 */
            var root = document.documentElement;
            if (dark) {
              root.classList.add('dark');
              root.setAttribute('data-theme', 'authenticator');
            } else {
              root.classList.remove('dark');
              root.setAttribute('data-theme', 'light');
            }
          } catch (e) { /* 存储不可用：保持 html 静态属性（深色） */ }
        })();
      </script>
  </head>
  <body class="min-h-screen antialiased bg-auth-bg">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
