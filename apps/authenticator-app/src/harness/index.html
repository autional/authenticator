<!DOCTYPE html>
<html lang="zh-CN" class="dark" data-theme="authenticator">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.autional.cn/ui/v0.1.0-rc.f0db1b97/tokens.css" />
    <meta name="robots" content="noindex, nofollow" />
    <title>authenticator contrast harness</title>
    <script src="/env.js"></script>
    <script>
      (function () {
        try {
          /* 复刻生产 index.html 主题启动块（dark-first：saved !== 'light' → 深色），
             主题源改为 ?theme=dark|light（取景纪律②：一个 target 页只量一个主题）。 */
          var theme = new URLSearchParams(window.location.search).get('theme');
          var dark = theme ? theme !== 'light' : true;
          var root = document.documentElement;
          if (dark) {
            root.classList.add('dark');
            root.setAttribute('data-theme', 'authenticator');
          } else {
            root.classList.remove('dark');
            root.setAttribute('data-theme', 'light');
          }
          /* UnlockGate 需要「PIN 已启用」载荷（deviceKeyWrap != null）才渲染 PIN 屏而非 children */
          localStorage.setItem(
            'autional-authenticator-v2',
            '{"version":2,"salt":"seed","deviceKey":null,"deviceKeyWrap":{"iv":"seed","ciphertext":"seed"},"data":{"iv":"seed","ciphertext":"seed"}}'
          );
        } catch (e) {
          /* 存储不可用：保持 html 静态属性（深色） */
        }
      })();
    </script>
  </head>
  <body class="min-h-screen antialiased bg-auth-bg">
    <div id="root"></div>
    <script type="module" src="/src/harness/main.tsx"></script>
  </body>
</html>
