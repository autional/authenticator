name: CI

# 单仓唯一流水线：test / typecheck / lint / lint:a11y（存量 build 见下方注释，暂不入门）。
# a11y 闸门（AC C-28 / ui-denominator U4）：jsx-a11y recommended，0 error/warn 才算过。
# 2026-11-13：原 a11y.yml 并入本文件，避免两条 workflow 重复 install。

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本由根 package.json 的 packageManager 提供（唯一真源），此处不再指定。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      # 存量 lint（= `eslint src/`）已于 2026-11-13 入门：apps/authenticator-app/eslint.config.mjs
      # 接入共享配置 @autional/eslint-config（与另 8 个门户同一形状），error 必须为 0；
      # 现存 3 条 warn（no-explicit-any ×2、no-unused-vars ×1）按舰队登记制放行。
      - name: Lint
        run: pnpm lint

      - name: A11y lint
        run: pnpm --filter @autional/authenticator-app run lint:a11y

      # 焦点可见性守卫：禁止用 outline-none 压掉设计系统的 :focus-visible 焦点环
      # （唯一例外 = 同一 className 自己画了 ring-*）。脚本无依赖，秒级。
      - name: Focus-visible guard
        run: pnpm --filter @autional/authenticator-app run lint:focus

      # 构建暂不入门：`pnpm build` 依赖部署侧 env（REGION / SITE_URL / CDN_HOST / API_ORIGIN，
      # 见 scripts/env.mjs）——本地无 API_ORIGIN 时实测失败：
      #   [build-env] 前端 API 模式为 direct 但缺少 API_ORIGIN（跨域直连必须有绝对源站）
      # 补齐部署 env 后可在此追加 `pnpm build`。
